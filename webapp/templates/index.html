<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Player Similarity</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="page">
    <header class="header">
      <h1>Player Similarity</h1>
      <p class="sub">Search a player → get similar profiles with “closest features” + biggest differences.</p>
    </header>

    <section class="panel">
      <div class="controls">
        <!-- ✅ IMPORTANT: suggestions dropdown is anchored to this wrapper -->
        <div class="search-wrap">
          <label class="label" for="search">Player</label>
          <input
            id="search"
            class="input"
            type="text"
            placeholder="Start typing a name…"
            autocomplete="off"
          />
          <div id="suggestions" class="suggestions hidden" aria-label="Suggestions"></div>
        </div>

        <div class="control">
          <label class="label" for="top_n">Top N</label>
          <input id="top_n" class="input" type="number" min="1" max="100" value="10" />
        </div>

        <div class="control">
          <label class="label" for="diff_topk">Diff TopK</label>
          <input id="diff_topk" class="input" type="number" min="1" max="25" value="8" />
        </div>

        <div class="control">
          <label class="label label-spacer"> </label>
          <button id="go" class="btn" type="button">Go</button>
        </div>
      </div>

      <div id="selected" class="selected hidden"></div>
      <div id="status" class="status hidden"></div>
    </section>

    <section class="results-wrap">
      <div id="results"></div>
    </section>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
