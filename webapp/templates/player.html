{% extends "base.html" %}
{% block title %}Player Profile — Football Analytics{% endblock %}

{% block content %}
<div class="page">
  <div class="panel page-search-panel">
    <div class="search-wrap">
      <label class="label" for="player-search">Search player</label>
      <input id="player-search" class="input" type="text" placeholder="Type a name, or filter below…" autocomplete="off"/>
      <div id="player-suggestions" class="suggestions hidden"></div>
    </div>
    <div id="player-filters"></div>
  </div>
  <div id="player-root">
    <div class="profile-loading">Loading profile…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const PLAYER_KEY = {{ player_key | tojson }};
  const DATASET    = {{ dataset    | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script>
  (async () => {
    initPlayerSearch(
      document.getElementById("player-search"),
      document.getElementById("player-suggestions"),
      p => { window.location.href = `/player/${encodeURIComponent(p.player_key)}/${encodeURIComponent(p.dataset)}`; },
      document.getElementById("player-filters")
    );

    const root = document.getElementById("player-root");
    try {
      const prof = await safeJsonFetch(
        `/api/player_profile?player_key=${encodeURIComponent(PLAYER_KEY)}&dataset=${encodeURIComponent(DATASET)}&topk=200`
      );
      document.title = (prof.player || "Player") + " — Football Analytics";
      await ensureTraitMeta((prof.top_traits || []).map(t => t.trait));

      const card = document.createElement("div");
      card.className = "profile-full-card";
      root.innerHTML = "";
      root.appendChild(card);
      renderFullProfileInto(card, prof);

      const btn = document.createElement("a");
      btn.className = "btn find-similar-btn";
      btn.style.cssText = "display:inline-block;margin-top:20px;text-decoration:none;";
      btn.href = `/?src_key=${encodeURIComponent(PLAYER_KEY)}&src_dataset=${encodeURIComponent(DATASET)}`;
      btn.textContent = "Find similar players →";
      card.appendChild(btn);

    } catch (err) {
      root.innerHTML = `<div class="profile-error">Could not load profile: ${escapeHtml(err.message)}</div>`;
    }
  })();
</script>
{% endblock %}
