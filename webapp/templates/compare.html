{% extends "base.html" %}
{% block title %}Compare — Football Analytics{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='compare.css') }}">
{% endblock %}

{% block content %}
<div class="page">
  <div class="cmp-search-row">
    <div class="panel cmp-search-panel">
      <label class="label" for="cmp-search-a">Player A</label>
      <div class="search-wrap">
        <input id="cmp-search-a" class="input" type="text" placeholder="Search player A…" autocomplete="off"/>
        <div id="cmp-suggestions-a" class="suggestions hidden"></div>
      </div>
      <div id="cmp-filters-a"></div>
    </div>
    <div class="cmp-vs-static">vs</div>
    <div class="panel cmp-search-panel">
      <label class="label" for="cmp-search-b">Player B</label>
      <div class="search-wrap">
        <input id="cmp-search-b" class="input" type="text" placeholder="Search player B…" autocomplete="off"/>
        <div id="cmp-suggestions-b" class="suggestions hidden"></div>
      </div>
      <div id="cmp-filters-b"></div>
    </div>
  </div>
  <div id="compare-root"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const SRC_KEY     = {{ src_key     | tojson }};
  const SRC_DATASET = {{ src_dataset | tojson }};
  const DST_KEY     = {{ dst_key     | tojson }};
  const DST_DATASET = {{ dst_dataset | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='compare.js') }}"></script>
{% endblock %}
