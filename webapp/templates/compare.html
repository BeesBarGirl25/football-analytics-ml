{% extends "base.html" %}
{% block title %}Compare — Football Analytics{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='compare.css') }}">
{% endblock %}

{% block content %}
<div class="page">
  <div id="compare-root">
    <div class="profile-loading">Loading comparison…</div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  const SRC_KEY     = {{ src_key     | tojson }};
  const SRC_DATASET = {{ src_dataset | tojson }};
  const DST_KEY     = {{ dst_key     | tojson }};
  const DST_DATASET = {{ dst_dataset | tojson }};
</script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='compare.js') }}"></script>
{% endblock %}
